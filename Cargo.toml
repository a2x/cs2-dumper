[package]
name = "cs2-dumper"
version = "0.1.3"
authors = ["a2x"]
edition = "2024"
readme = "README.md"
repository = "https://github.com/a2x/cs2-dumper"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
heck = "0.5"
log = "0.4"
memflow = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.12"
memflow-native = { git = "https://github.com/memflow/memflow-native", version = "0.2.6" }
skidscan = "2.0"
skidscan-macros = "0.1"
thiserror = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
strip = true
